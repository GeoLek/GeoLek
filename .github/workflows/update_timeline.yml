
name: Update Timeline Image

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeline-image-update
  cancel-in-progress: false

jobs:
  update-image:
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Checkout source code from main
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      # Step 2: Set up modern Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      # Step 4: Generate the timeline image
      - name: Generate Timeline Image
        env:
          MPLBACKEND: Agg
        run: |
          echo "Current UTC time:"
          date -u

          echo "Python version:"
          python --version

          python timeline.py

          echo "Checking generated image:"
          test -s timeline.png
          file timeline.png
          sha256sum timeline.png

      # Step 5: Checkout gh-pages separately
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish

      # Step 6: Copy, commit and push updated image
      - name: Publish Timeline Image
        shell: bash
        run: |
          set -euo pipefail

          # Copy the newly generated image
          cp timeline.png publish/timeline.png

          # Configure GitHub Actions bot
          git -C publish config user.name "github-actions[bot]"
          git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the image
          git -C publish add timeline.png

          # Avoid unnecessary commits
          if git -C publish diff --cached --quiet; then
            echo "Timeline already up to date."
            exit 0
          fi

          # Commit and push only to gh-pages
          git -C publish commit -m "Update timeline image [skip ci]"
          git -C publish push origin HEAD:gh-pages

          echo "Timeline successfully published."
